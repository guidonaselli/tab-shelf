<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title data-i18n="extName"></title>
    <style>html { background: light-dark(#f7f8f9, #1b1c1e); color-scheme: light dark; }</style>
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <div class="search">
      <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-label="searchPlaceholder">
      <button type="button" id="settings-toggle" class="tool" data-i18n-title="settingsHeading" data-i18n-label="settingsHeading" aria-expanded="false" aria-controls="settings"></button>
    </div>
    <p id="status" role="status" hidden></p>
    <div id="list-view">
      <div id="dup-bar" class="dup-bar" hidden><button type="button" id="dup-close"></button></div>
      <section>
        <h2 data-i18n="pinsHeading"></h2>
        <ul id="pins" class="list"></ul>
        <p id="pins-empty" class="hint" data-i18n="pinsEmpty" hidden></p>
      </section>
      <div id="windows"></div>
      <p id="no-results" class="hint" data-i18n="noResults" hidden></p>
    </div>
    <section id="settings" hidden>
      <h2 data-i18n="settingsHeading"></h2>
      <label><span data-i18n="settingsSide"></span>
        <select id="setting-side">
          <option value="left" data-i18n="sideLeft"></option>
          <option value="right" data-i18n="sideRight"></option>
        </select>
      </label>
      <label><span data-i18n="settingsMode"></span>
        <select id="setting-mode">
          <option value="hover" data-i18n="modeHover"></option>
          <option value="off" data-i18n="modeOff"></option>
        </select>
      </label>
      <label><span data-i18n="settingsWidth"></span>
        <select id="setting-width">
          <option value="280" data-i18n="widthNarrow"></option>
          <option value="340" data-i18n="widthNormal"></option>
          <option value="440" data-i18n="widthWide"></option>
          <option value="560" data-i18n="widthXWide"></option>
        </select>
      </label>
      <label><span data-i18n="settingsOpacity"></span>
        <input type="range" id="setting-opacity" min="50" max="100" step="5">
      </label>
      <label><span data-i18n="settingsAccent"></span>
        <span class="accent-pick"><input type="color" id="setting-accent"><button type="button" id="accent-reset" data-i18n="accentReset"></button></span>
      </label>
      <label><span data-i18n="settingsZone"></span>
        <select id="setting-zone">
          <option value="4" data-i18n="zoneSmall"></option>
          <option value="16" data-i18n="zoneMedium"></option>
          <option value="32" data-i18n="zoneLarge"></option>
        </select>
      </label>
      <label><span data-i18n="settingsSpeed"></span>
        <select id="setting-speed">
          <option value="fast" data-i18n="speedFast"></option>
          <option value="normal" data-i18n="speedNormal"></option>
          <option value="slow" data-i18n="speedSlow"></option>
        </select>
      </label>
      <label><span data-i18n="settingsDensity"></span>
        <select id="setting-density">
          <option value="comfortable" data-i18n="densityComfortable"></option>
          <option value="compact" data-i18n="densityCompact"></option>
        </select>
      </label>
      <h2 data-i18n="settingsBackup"></h2>
      <div class="backup">
        <button type="button" id="backup-export" data-i18n="backupExport"></button>
        <button type="button" id="backup-import" data-i18n="backupImport"></button>
        <input type="file" id="backup-file" accept="application/json,.json" hidden>
      </div>
      <h2 data-i18n="settingsSites"></h2>
      <div id="site-current" class="site-row" hidden>
        <span id="site-host" class="title"></span>
        <button type="button" id="site-toggle"></button>
      </div>
      <ul id="site-list" class="list"></ul>
      <p id="site-empty" class="hint" data-i18n="sitesEmpty" hidden></p>
    </section>
    <script type="module" src="panel.js"></script>
  </body>
</html>
