name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Manifest and locales are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
          for f in _locales/*/messages.json; do node -e "JSON.parse(require('fs').readFileSync('$f'))"; done
